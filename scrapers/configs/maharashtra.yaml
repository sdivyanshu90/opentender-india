# Maharashtra coverage (EXPERIMENTAL): state power utilities + NIC S3WaaS district sites.
# Verified 2026-10-04 with scrapers.core.http.HttpClient (project UA, robots.txt
# enforced, >=4s delay), <=10 requests per site, no login/CAPTCHA contact.
# mahatenders.gov.in is intentionally never contacted.

sources:
  - id: mahagenco_notices
    family: notice_pages
    parser: mahagenco
    name: MahaGenco tender notices
    base_url: https://www.mahagenco.in/tenders
    region: Maharashtra
    state: Maharashtra
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    window_days: 60        # publication time is only in the PDF filename; skip history

  - id: mahatransco_tenders
    family: notice_pages
    parser: mahatransco
    name: MahaTransco (MSETCL) active tenders
    base_url: https://www.mahatransco.in/tenders/active
    region: Maharashtra
    state: Maharashtra
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    max_pages: 5           # 20 rows/page, offset pagination

  - id: msedcl_tenders
    family: notice_pages
    parser: msedcl
    name: MSEDCL (Mahadiscom) supplier tenders
    base_url: https://www.mahadiscom.in/en/supplier/tenders/
    region: Maharashtra
    state: Maharashtra
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    max_pages: 3           # WordPress grid, 6 posts/page, /page/N/
    window_days: 90
    # Listing carries title + post date only; closing dates are inside the notice.

# --- NIC S3WaaS district sites. Verified = archive page /en/past-notices/tenders/
# answered 200 with the S3WaaS template. Not included (one request each, no retry):
#   robots.txt disallows the path: aurangabad.gov.in (Chhatrapati Sambhajinagar),
#     buldhana.gov.in, chandrapur.gov.in, hingoli.gov.in, sangli.gov.in, sindhudurg.gov.in
#   TLS certificate invalid (not bypassed): ahmednagar.gov.in (Ahilyanagar),
#     osmanabad.gov.in (Dharashiv), satara.gov.in
#   (mumbaisuburban and solapur serve the template but had an empty archive.)

  - id: s3waas_akola
    family: s3waas
    name: "Akola district tenders (S3WaaS)"
