# OpenTender India source configuration.
#
# Every portal listed here was verified live against its official host.
# Statuses follow docs/source-research.md:
#   ACTIVE | EXPERIMENTAL | RESEARCHING | DEGRADED | CAPTCHA_LIMITED |
#   LOGIN_REQUIRED | POLICY_RESTRICTED | RUNNER_BLOCKED | TEMPORARILY_BROKEN | DEPRECATED
#
# Harvest strategies (GePNIC family):
#   closing_by_date - "tenders by closing date" listing
#   latest_active   - active tenders listing
#   home_widget     - always-open "latest tenders" widget on the app root
#   org_walk        - open "Tenders by Organisation" pages: org list with live
#                     counts, then each org's full tender list (largest first,
#                     capped by max_orgs); falls back to home_widget when empty
# As of Oct 2026 every deployment below CAPTCHA-gates closing_by_date and
# latest_active (runtime guard stops politely), so they use org_walk.

sources:
  # ---- Central ------------------------------------------------------------
  - id: cppp_epublish
    family: gepnic
    name: CPPP ePublishing (Central Public Procurement Portal)
    base_url: https://eprocure.gov.in/epublish
    app_path: /app
    region: Central Government
    status: ACTIVE
    enabled: true
    crawl_delay: 4.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 20

  - id: gem_bids
    family: gem
    name: GeM BidPlus (Government e-Marketplace)
    base_url: https://bidplus.gem.gov.in
    region: Central / all-India
    status: ACTIVE
    enabled: true
    crawl_delay: 3.5
    max_pages: 50   # ~500 newest ongoing bids/run (10 per page); env OPENTENDER_GEM_MAX_PAGES overrides
    sort: Bid-Start-Date-Latest

  # ---- GePNIC states (verified live) --------------------------------------
  - id: gepnic_rajasthan
    family: gepnic
    name: Rajasthan eProcurement (GePNIC)
    base_url: https://eproc.rajasthan.gov.in
    region: Rajasthan
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 20
    state: Rajasthan

  - id: gepnic_kerala
    family: gepnic
    name: Kerala eTenders (GePNIC)
    base_url: https://etenders.kerala.gov.in
    region: Kerala
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 20
    state: Kerala

  - id: gepnic_madhya_pradesh
    family: gepnic
    name: MP Tenders (GePNIC)
    base_url: https://mptenders.gov.in
    region: Madhya Pradesh
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 20
    state: Madhya Pradesh

  - id: gepnic_uttarakhand
    family: gepnic
    name: Uttarakhand eProcurement (GePNIC)
    base_url: https://uktenders.gov.in
    region: Uttarakhand
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 20
    state: Uttarakhand

  - id: gepnic_jammu_kashmir
    family: gepnic
    name: J&K eTenders (GePNIC)
    base_url: https://jktenders.gov.in
    region: Jammu and Kashmir
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 20
    state: Jammu and Kashmir

  # ---- PSU GePNIC deployments ---------------------------------------------
  - id: gepnic_bel
    family: gepnic
    name: Bharat Electronics Ltd eProcurement
    base_url: https://eprocurebel.co.in
    region: PSU (MoD)
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 5.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 20

  # ---- Policy-restricted ----------------------------------------------------
  # robots.txt of mahatenders.gov.in disallows ALL crawlers ("Disallow: /").
  # We respect that: this adapter ships fully implemented but stays disabled in
  # shared automation. Operators may enable it locally only via
  # OPEN_TENDER_ALLOW_POLICY_RESTRICTED=1 after making their own judgement.
  - id: mahatenders
    family: gepnic
    name: MahaTenders (Maharashtra eProcurement)
    base_url: https://mahatenders.gov.in
    region: Maharashtra
    status: POLICY_RESTRICTED
    enabled: true            # adapter registered; gated at runtime (see registry)
    crawl_delay: 6.0
    harvest: [home_widget]
    policy_notes: >
      robots.txt disallows all crawling. Adapter disabled unless explicitly
      overridden locally. Home widgets and detail pages are public but listings,
      search and document downloads are CAPTCHA-gated; we never bypass CAPTCHA.

  - id: ireps_works
    family: ireps
    name: Indian Railways E-Procurement (Works module)
    base_url: https://www.ireps.gov.in
    region: Indian Railways
    status: EXPERIMENTAL
    # robots.txt disallows the anonymous works search (re-checked 4 Oct 2026);
    # every run ended in RobotsDisallowedError, so keep it off until that changes.
    enabled: false
    crawl_delay: 5.0
    max_zones_per_run: 4
    window_days: 7

  # ---- Researching (adapters pending) ---------------------------------------
  # Karnataka KPPP (SPA), Gujarat nProcure, Telangana/AP custom portals are
  # tracked in docs/source-research.md with RESEARCHING status.
