# GePNIC expansion: official NIC GePNIC portals whose open "Tenders by
# Organisation" page was verified live on 2026-10-04.
# Method: scrapers.core.http.HttpClient (project UA, robots.txt enforced, 4s
# delay), one GET of <base><app_path>?page=FrontEndTendersByOrganisation&service=page
# per portal, parsed with GePNICAdapter._parse_org_list. No CAPTCHA contact, no login.
# Portals that were down, geo-blocked, CAPTCHA-gated or duplicate another instance
# are omitted; see docs/recon/gepnic-expansion-2026-10.md.

sources:
  - id: gepnic_central_eprocure
    family: gepnic
    name: CPPP eProcure eProcurement (GePNIC)
    base_url: https://eprocure.gov.in
    app_path: /eprocure/app
    region: Central Government
    status: EXPERIMENTAL
    enabled: true
    crawl_delay: 4.0
    harvest: [org_walk]
    max_orgs: 60
    max_detail_per_run: 10

