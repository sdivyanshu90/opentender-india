name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm ci || npm install
          npm run build
      - name: Copy generated datasets + status into the site
        run: |
          mkdir -p apps/web/dist/data/index apps/web/dist/data/status-sources.json.tmp
          if [ -d data/indexes ]; then cp -r data/indexes/* apps/web/dist/data/index/; fi
          if [ -f status/sources.json ]; then cp status/sources.json apps/web/dist/data/status-sources.json; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
