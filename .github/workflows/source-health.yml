name: source-health

# Portal smoke tests (spec #46). Detects outages/redesigns between daily runs.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: data-commit # serialised with ingestion, which also writes status/sources.json
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . --quiet
      - name: Healthcheck every registered source (failures isolated)
        run: opentender health || true
      - name: Commit health status
        run: |
          git config user.name "opentender-bot"
          git config user.email "actions@opentender.invalid"
          git add status/sources.json
          git diff --cached --quiet || (git commit -m "status: source health check [skip ci]" && git pull --rebase --quiet origin main && git push)
