name: e2e

# Playwright E2E journeys (spec #86) against the production build with
# labelled fixture data. Runs on demand / weekly rather than every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "53 23 * * 5" # Fridays, non-round minute

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Seed labelled fixture data
        run: npm run seed
      - name: Build production bundle
        run: npm run build
      - name: Run E2E journeys
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
