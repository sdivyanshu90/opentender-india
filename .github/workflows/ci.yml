name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" --quiet
      - name: Lint
        run: ruff check scrapers packages cli.py tests
      - name: Parser fixture tests + AI schema tests
        run: pytest tests/ -q --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - name: Seed dev fixtures (labelled synthetic data)
        run: npm run seed
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard - no project API key may ever reach the browser bundle
        run: |
          if grep -R "OPENROUTER_API_KEY" apps/web/src apps/web/index.html; then
            echo "::error::OPENROUTER_API_KEY referenced in frontend code"; exit 1
          fi
          # real keys look like sk-or-v1-<64 hex>; UI placeholders like "sk-or-v1-…" must not trip this
          if grep -RIE "sk-or-v[0-9]+-[A-Za-z0-9]{16,}" apps/web/src; then
            echo "::error::possible API key literal in frontend source"; exit 1
          fi
