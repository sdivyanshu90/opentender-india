name: fetch-tenders

# Daily ingestion (spec #45). Non-round minute in IST early morning.
#
# Storage (ADR-005): the tender store (data/hot + data/state.json) is carried
# between runs in the Actions cache, and the built datasets are handed to
# deploy.yml as the `site-data` artifact. Only small status files are committed,
# so ~25k daily-rewritten records never churn git history. Every run re-walks
# all active tenders, so a cache eviction loses revision history, not data.
on:
  schedule:
    - cron: "47 20 * * *" # 02:17 IST
  workflow_dispatch:
    inputs:
      source:
        description: "Limit to a single source id (optional)"
        required: false
      skip_ai:
        description: "Skip AI enrichment"
        type: boolean
        default: false
  workflow_call: # weekly-reconcile reuses this pipeline with a full organisation walk
    inputs:
      full_walk:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    concurrency:
      group: data-commit # shared with every job that pushes data/status
      cancel-in-progress: false
    timeout-minutes: 240 # CPPP state rotation (~2h) runs in parallel with GePNIC hosts
    env:
      MAX_AI_REQUESTS_PER_DAY: ${{ vars.MAX_AI_REQUESTS_PER_DAY || '40' }}
      # GePNIC org walk: daily visits the largest 60 orgs per portal (~97% of
      # tenders); the weekly reconcile walks all of them.
      OPEN_TENDER_MAX_ORGS: ${{ inputs.full_walk && '100000' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline
        run: pip install -e ".[dev]" --quiet

      - name: Restore tender store + AI cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hot
            data/state.json
            data/indexes/search-docs.meta.json
            data/ai-cache
          key: tender-store-${{ github.run_id }}
          restore-keys: tender-store-

      - name: Discover + fetch permitted sources
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} # never printed; masked by Actions
          SOURCE_OVERRIDE: ${{ inputs.source || '' }}
        # each source fails independently inside the CLI; a non-zero exit means
        # nothing at all was fetched, which must fail the run
        run: |
          if [ -n "$SOURCE_OVERRIDE" ]; then
            opentender fetch "$SOURCE_OVERRIDE"
          else
            opentender fetch --all
          fi

      - name: Validate canonical schema
        run: opentender validate

      - name: Cross-source dedupe
        run: opentender dedupe

      - name: AI enrichment within budget
        if: ${{ !inputs.skip_ai }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          opentender ai queue --reason new --limit 30 || true
          opentender ai queue --reason corrigendum --limit 15 || true
          opentender ai queue --reason closing_soon --limit 15 || true
          opentender ai run --max-tasks 40 || echo "::warning::AI step degraded; pipeline continues"

      # quality gate inside build-index: refuses an empty or collapsed dataset
      - name: Build indexes, feeds, digest
        run: opentender build-index

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Save tender store
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/hot
            data/state.json
            data/indexes/search-docs.meta.json
            data/ai-cache
          key: tender-store-${{ github.run_id }}

      - name: Hand datasets to deploy
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          retention-days: 14
          if-no-files-found: error
          path: |
            data/indexes/search-docs.json.gz
            data/indexes/search-docs.meta.json
            data/index/manifest.json
            data/feeds
            data/details
            data/public/status-sources.json
            status/sources.json

      - name: Commit status + digest
        run: |
          git config user.name "opentender-bot"
          git config user.email "actions@opentender.invalid"
          git add status data/ai-queue.jsonl
          if git diff --cached --quiet; then
            echo "no status changes"
          else
            git commit -m "data: daily ingestion $(date -u +%F) [skip ci]"
            git pull --rebase --quiet origin main
            git push
          fi
