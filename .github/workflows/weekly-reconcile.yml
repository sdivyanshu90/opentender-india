name: weekly-reconcile

# Broader reconciliation crawl (spec #46/#81): the daily run visits the largest
# organisations per GePNIC portal; once a week the same pipeline walks every
# organisation so small buyers' tenders are never missed for long.
on:
  schedule:
    - cron: "31 21 * * 0" # Sundays 03:01 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    uses: ./.github/workflows/fetch-tenders.yml
    with:
      full_walk: true
    secrets: inherit
