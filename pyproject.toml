[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentender-india"
version = "0.1.0"
description = "OpenTender India - open-source tender intelligence platform (ingestion + AI pipeline)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "typer>=0.12",
    "jsonschema>=4.22",
    "pypdf>=4.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
opentender = "cli:app_main"

[tool.setuptools]
packages = ["scrapers", "scrapers.core", "scrapers.core.parsers", "scrapers.adapters", "opentender_ai"]
py-modules = ["cli"]

[tool.setuptools.package-dir]
scrapers = "scrapers"
"scrapers.core" = "scrapers/core"
"scrapers.adapters" = "scrapers/adapters"
opentender_ai = "packages/ai/opentender_ai"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "S311", "UP038", "SIM114", "F541", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
